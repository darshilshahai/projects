services:
  - type: web
    name: beforeyoubuild-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: RESEARCH_MODEL
        value: gpt-5.6-luna
      - key: ANALYSIS_MODEL
        value: gpt-5.6
      - key: RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: OPENAI_API_KEY
        sync: false
